services:
  db:
    image: postgres:17
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: "${WAREHOUSE_DATABASE_PASSWORD:?Set WAREHOUSE_DATABASE_PASSWORD}"
      POSTGRES_DB: postgres
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse -d postgres"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  postgres_data: